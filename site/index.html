    <meta name="dc.description" content="The Temporal Equivalence Principle (TEP) predicts correlated phase-coherent disturbances in GNSS timekeeping with a spatial correlation length of order thousands of kilometres, an east–west anisotropy, coupling to Earth orbital velocity, and an annual-phase direction near Earth&#x27;s aphelion velocity tangent. The directed CMB-apex template is anti-phase rather than detected as a rest frame. Papers 1 and 2 examined these signatures in GPS precise point-positioning products from three analysis centres spanning 2000–2025; Paper 3 used raw RINEX single-point positioning. This paper is a product-type independence stress test using the public CODE COD0MGXFIN combined multi-GNSS receiver-clock solution distributed by NASA CDDIS from 2025-01-01 to 2026-05-01. Receiver-clock offsets for 418 globally distributed stations are read directly from daily 5-minute CLK files. The combined solution provides no per-constellation independence, but supplies a distinct product family and a largely held-out 2025–2026 epoch. The isotropic correlation length is λ = 1862 km (R² = 0.699; 1.83 million pair-day observations; rising to R² = 0.85–0.92 for baselines above 500 km) with a formal within-fit error of ±112 km and a cluster-robust statistical uncertainty of ±155 km obtained by resampling whole epochs (month-block bootstrap over 17 calendar months; day-block ±86 km; leave-one-month-out jackknife ±94 km), confirming bounded thousands-of-kilometres clock coherence in an independent multi-constellation product family and a held-out 2025–2026 epoch. The numeric scale is epoch- and product-conditioned at the ~30–40% level: single-window realisations span 1,050–1,935 km, and matched-day estimates are 2,744 km for CODE against 1,933 km for the independently processed GRG product chain (same tracking network) — the latter landing within 4% of the pooled scale — while a controlled decomposition on identical station-days bounds the spectral-resolution and common-mode contributions at ≲±25% and reproduces the same band-ordered profile (Step 3.5). It is stable at 1,819–2,000 km across minimum-baseline cutoffs of 50–2,000 km and persists on geomagnetically quiet days (λ = 1708 km, R² = 0.743). The full-range anisotropy is not statistically resolved in the combined solution (ratio 1.29, station-clustered p = 0.49), and the primary monthly λ and EW/NS orbital metrics are null (Bonferroni p &gt; 0.5). A model-free PA-difference statistic recovers the predicted negative coupling with orbital speed (r = −0.716, p = 0.0018) and CMB-dipole velocity projection (r = −0.767, p = 0.0005) across 16 chronological full months. Autocorrelation-aware corrections preserve the projection-channel association: the effective-degrees-of-freedom values are p = 0.072 (speed) and p = 0.018 (v_proj), matched AR(1) surrogates give p = 0.019 and p = 0.003, the phase-preserving circular-shift null reaches its 1/16 resolution floor for the projection channel, and leave-one-month-out correlations stay within r = −0.66 to −0.86, so no single phase alignment dominates. The association also survives operational-asymmetry controls: a composition-matched EW−NS contrast over distance × latitude cells gives r = −0.65 (p = 0.006) for the projection channel, and a uniformly-tracked-station subset gives r = −0.74 (p = 0.001). Hemisphere-split checks return the same signed anticorrelation in northern, southern, and cross-hemisphere pair classes (r = −0.45, −0.88, −0.49) at a common annual phase (Δφ = 22° ± 44°), favouring a global heliocentric driver over hemisphere-local seasonal systematics. The physical hypothesis and sign were pre-specified by earlier TEP-GNSS papers, making this cross-product corroboration of the orbital-coupling sign alongside an exploratory estimator selection within MGEX. A 37 × 19 directional grid finds strong within-grid modulation (200-permutation plus-one p = 0.005). Its nominal maximum is 82.7° from the CMB dipole. Orbital velocity constrains only an axis’s projection onto the orbital plane, and that projection is highly degenerate (the CMB and nominal-maximum projected predictors correlate at r = 0.984, and only 61 of 703 grid directions meet or exceed the direct-CMB |r|). The CMB-labelled projection is therefore one member of a broad family of annual templates, not evidence for a CMB rest frame or a unique three-dimensional axis. All four null controls pass under the robust analysis (minimum baseline 500 km); under the primary short-baseline parameters the solar-rotation reassignment null retains R² = 0.50, traced to a small-sample bin artifact at 100–152 km, so the robust analysis is reported as the clean result (the fitted scale is stable, 1,862 vs 1,819 km). The two leading mundane attribution channels are explicitly modelled and strongly disfavoured by the tested controls rather than assumed absent: a forward-modelled shared satellite-error kernel is flat through the signal band and decays only on the constellation-footprint scale, and the weather-organized partitions contradict the atmospheric signature — cross-hemisphere pairs retain the cleanest decay (λ = 2101 km) while same-latitude-band pairs beyond 8,000 km return −0.118 rather than the positive zonal coherence an atmospheric driver requires. A supplementary satellite-clock analysis does not recover the exponential structure, consistent with the shared reference-time architecture of the combined MGEX product: because satellite clocks are not independently estimated in that product, it tests only the receiver-clock channel, and the satellite-clock null is a product limitation rather than a prediction test.">
